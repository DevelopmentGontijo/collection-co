<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />

  <title>[NOME DA EMPRESA] — Estruturas Metálicas e Móveis Sob Medida</title>

  <meta
    name="description"
    content="Estruturas metálicas e móveis sob medida para residências, comércios e indústrias. Projeto, fabricação, acabamento, entrega e montagem."
  />

  <link rel="canonical" href="https://www.seudominio.com.br/" />
  <link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&display=swap" rel="stylesheet" />

  <style>
    :root {
      --menu-size: 0.72rem;
      --submenu-size: 0.65rem;
      --gold: #d9a441;
      --white: #ffffff;
      --dark: #101820;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--dark);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    *::selection {
      background: transparent;
      color: inherit;
    }

    .background-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.58;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 2;
      width: min(900px, 90vw);
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      width: min(280px, 70vw);
      height: auto;
      margin-bottom: 1.5rem;
      animation: blur-in 1.8s ease-out forwards;
    }

    h1 {
      margin: 0 auto 0.75rem;
      max-width: 850px;
      color: var(--white);
      font-size: clamp(1.8rem, 3vw, 3rem);
      font-weight: 300;
      line-height: 1.2;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.78);
      animation: blur-in 1.8s ease-out forwards;
    }

    .frase-entrada {
      margin: 0;
      color: var(--white);
      font-family: "Tenor Sans", sans-serif;
      font-size: clamp(0.6rem, 1vw, 0.78rem);
      letter-spacing: 0.13em;
      line-height: 1.7;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.78);
      animation: blur-in 2.2s ease-out forwards;
    }

    @keyframes blur-in {
      from {
        opacity: 0;
        filter: blur(8px);
      }

      to {
        opacity: 1;
        filter: blur(0);
      }
    }

    .blur-effect {
      animation: blur-in 1.8s ease-out;
    }

    /* Menu desktop */
    nav#top-menu {
      position: fixed;
      top: 0.75rem;
      left: 0;
      z-index: 20;
      width: 100%;
      display: flex;
      justify-content: center;
      font-family: "Tenor Sans", sans-serif;
    }

    nav#top-menu .menu-item {
      position: relative;
      display: flex;
      justify-content: center;
    }

    nav#top-menu .menu-link {
      color: var(--white);
      font-size: var(--menu-size);
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
      cursor: pointer;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.8);
    }

    nav#top-menu .menu-link::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -6px;
      width: 0;
      height: 1px;
      background: var(--gold);
      transform: translateX(-50%);
      transition: width 0.5s ease;
    }

    nav#top-menu .menu-item:hover .menu-link::after,
    nav#top-menu .menu-item.open .menu-link::after {
      width: 85%;
    }

    nav#top-menu .dropdown {
      position: absolute;
      top: 1.8rem;
      min-width: 260px;
      padding: 0.7rem 0;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px);
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
    }

    nav#top-menu .menu-item.open .dropdown,
    nav#top-menu .menu-item:hover .dropdown {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      pointer-events: auto;
    }

    nav#top-menu .dropdown-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(16, 24, 32, 0.8);
      backdrop-filter: blur(10px);
    }

    nav#top-menu .dropdown-inner a {
      color: var(--white);
      font-size: var(--submenu-size);
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
      transition: color 0.25s ease;
    }

    nav#top-menu .dropdown-inner a:hover {
      color: var(--gold);
    }

    /* Botão mobile */
    .menu-button {
      position: fixed;
      left: 50%;
      bottom: 1.2rem;
      z-index: 10001;
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
      transform: translateX(-50%);
    }

    .menu-button div {
      width: 22px;
      height: 2px;
      margin: 3px 0;
      background: var(--white);
      border-radius: 2px;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.8);
      transition: all 0.4s ease;
    }

    .menu-button div:nth-child(2) {
      width: 14px;
    }

    .menu-button.active div {
      background: var(--gold);
    }

    /* Menu mobile */
    .mobile-menu {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(16, 24, 32, 0.94);
      backdrop-filter: blur(14px);
    }

    .mobile-menu.open {
      display: flex;
    }

    .mobile-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .mobile-menu a {
      color: var(--white);
      font-family: "Tenor Sans", sans-serif;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .mobile-main {
      font-size: 0.85rem;
    }

    .mobile-sublist {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .mobile-group.open .mobile-sublist {
      display: flex;
    }

    .mobile-sub {
      color: rgba(255, 255, 255, 0.8) !important;
      font-size: 0.68rem;
    }

    @media (max-width: 768px) {
      nav#top-menu {
        display: none;
      }

      .menu-button {
        display: flex;
      }

      h1 {
        font-size: 1.8rem;
      }

      .frase-entrada {
        font-size: 0.58rem;
      }
    }
  </style>
</head>

<body>
  <nav id="top-menu">
    <div class="menu-item">
      <a class="menu-link" href="/strategic-advisory/operational-diagnostics/">
        Soluções Metálicas
      </a>

      <div class="dropdown">
        <div class="dropdown-inner">
          <a href="/strategic-advisory/operational-diagnostics/">
            Residencial &amp; Móveis
          </a>

          <a href="/strategic-advisory/operational-transformation-execution/">
            Comercial
          </a>

          <a href="/strategic-advisory/operational-governance-risk/">
            Industrial
          </a>
        </div>
      </div>
    </div>
  </nav>

  <button class="menu-button" onclick="toggleMenu(event)" id="hamburgerButton" aria-label="Abrir menu">
    <div></div>
    <div></div>
    <div></div>
  </button>

  <div class="mobile-menu" id="mobileMenu">
    <div class="mobile-group">
      <a class="mobile-main" href="/strategic-advisory/operational-diagnostics/">
        Soluções Metálicas
      </a>

      <div class="mobile-sublist">
        <a class="mobile-sub" href="/strategic-advisory/operational-diagnostics/">
          Residencial &amp; Móveis
        </a>

        <a class="mobile-sub" href="/strategic-advisory/operational-transformation-execution/">
          Comercial
        </a>

        <a class="mobile-sub" href="/strategic-advisory/operational-governance-risk/">
          Industrial
        </a>
      </div>
    </div>
  </div>

  <video
    autoplay
    muted
    loop
    playsinline
    preload="auto"
    class="background-video"
    id="bgVideo">
    <source src="video6.mp4" type="video/mp4" />
  </video>

  <div class="container">
    <img
      class="logo"
      alt="Estruturas Metálicas"
      src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 180'%3E%3Cpath d='M28 144V34h26l40 62 40-62h26v110h-28V81l-28 43H74L46 81v63z' fill='%23ffffff'/%3E%3Cpath d='M182 34h22l39 54 39-54h22v110h-28V83l-25 35h-16l-25-35v61h-28z' fill='%23d9a441'/%3E%3Cpath d='M334 34h8v110h-8z' fill='%23ffffff' opacity='.62'/%3E%3Ctext x='372' y='78' fill='%23ffffff' font-family='Arial, Helvetica, sans-serif' font-size='31' font-weight='700' letter-spacing='3'%3EESTRUTURAS%3C/text%3E%3Ctext x='372' y='118' fill='%23d9a441' font-family='Arial, Helvetica, sans-serif' font-size='25' letter-spacing='6'%3EMET%C3%81LICAS%3C/text%3E%3C/svg%3E"
    />

    <h1 id="titulo">
      Estruturas metálicas e móveis sob medida para todos os espaços.
    </h1>

    <p id="frase" class="frase-entrada">
      DO PROJETO À MONTAGEM, SOLUÇÕES PARA RESIDÊNCIAS, COMÉRCIOS E INDÚSTRIAS.
    </p>
  </div>

  <script>
    const video = document.getElementById("bgVideo");
    const titulo = document.getElementById("titulo");
    const frase = document.getElementById("frase");
    const mobileMenu = document.getElementById("mobileMenu");
    const hamburgerButton = document.getElementById("hamburgerButton");
    const mobileGroup = document.querySelector(".mobile-group");
    const mobileMain = document.querySelector(".mobile-main");

    function forceVideoPlay() {
      if (!video) return;

      video.muted = true;
      video.playsInline = true;

      const playPromise = video.play();

      if (playPromise !== undefined) {
        playPromise.catch(() => {
          /* O fundo escuro continua visível se o vídeo não existir. */
        });
      }
    }

    window.addEventListener("load", forceVideoPlay);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        forceVideoPlay();
      }
    });

    function applyBlur() {
      titulo.classList.remove("blur-effect");
      frase.classList.remove("blur-effect");

      void titulo.offsetWidth;

      titulo.classList.add("blur-effect");
      frase.classList.add("blur-effect");
    }

    function toggleMenu(event) {
      event.stopPropagation();

      const isOpening = !mobileMenu.classList.contains("open");

      mobileMenu.classList.toggle("open");
      hamburgerButton.classList.toggle("active", isOpening);

      if (!isOpening) {
        mobileGroup.classList.remove("open");
      }
    }

    if (mobileMain) {
      mobileMain.addEventListener("click", (event) => {
        if (window.matchMedia("(max-width: 768px)").matches) {
          event.preventDefault();
          event.stopPropagation();

          mobileGroup.classList.toggle("open");
        }
      });
    }

    document.addEventListener("click", (event) => {
      if (!mobileMenu.contains(event.target) && !hamburgerButton.contains(event.target)) {
        mobileMenu.classList.remove("open");
        mobileGroup.classList.remove("open");
        hamburgerButton.classList.remove("active");
      }
    });

    setTimeout(applyBlur, 500);
  </script>
</body>
</html>
